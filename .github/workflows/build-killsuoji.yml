name: Build KillSuoji APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\\([^"]*\\)".*/\\1/p' app/build.gradle.kts)
          VERSION_NUMBER="${VERSION_NAME%% *}"
          APK_NAME="${VERSION_NUMBER}.apk"
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Copy versioned APK to download site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.version.outputs.apk_name }}"
          git commit -m "Publish KillSuoji APK to download site" || echo "APK unchanged"
          git push
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: KillSuoji ${{ steps.version.outputs.number }} Beta
          make_latest: true
          files: ${{ steps.version.outputs.apk_name }}
