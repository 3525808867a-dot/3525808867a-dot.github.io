name: Build KillSuoji APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | cut -d '"' -f2)
          VERSION_NUMBER="${VERSION_NAME%% *}"
          APK_NAME="${VERSION_NUMBER}.apk"
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Configure persistent APK signing
        env:
          KILLSUOJI_KEYSTORE_BASE64: ${{ secrets.KILLSUOJI_KEYSTORE_BASE64 }}
          KILLSUOJI_STORE_PASSWORD: ${{ secrets.KILLSUOJI_STORE_PASSWORD }}
          KILLSUOJI_KEY_ALIAS: ${{ secrets.KILLSUOJI_KEY_ALIAS }}
          KILLSUOJI_KEY_PASSWORD: ${{ secrets.KILLSUOJI_KEY_PASSWORD }}
        run: |
          if [ -z "$KILLSUOJI_KEYSTORE_BASE64" ] || [ -z "$KILLSUOJI_STORE_PASSWORD" ] || [ -z "$KILLSUOJI_KEY_ALIAS" ] || [ -z "$KILLSUOJI_KEY_PASSWORD" ]; then
            echo "::error::Persistent signing secrets are missing. Add all four KILLSUOJI_* secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KILLSUOJI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/killsuoji-release.jks"
          echo "KILLSUOJI_KEYSTORE_FILE=$RUNNER_TEMP/killsuoji-release.jks" >> "$GITHUB_ENV"
          echo "KILLSUOJI_STORE_PASSWORD=$KILLSUOJI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_ALIAS=$KILLSUOJI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_PASSWORD=$KILLSUOJI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Package SukiSU module
        run: |
          chmod 700 module/killsuoji-overlay/*.sh
          (cd module/killsuoji-overlay && zip -r "$GITHUB_WORKSPACE/killsuoji-overlay-1.0.0-beta.zip" module.prop service.sh watchdog.sh uninstall.sh)
      - name: Copy versioned APK to download site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk_name }}"
          python3 - <<'PY'
          import re
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              match = re.search(r'versionName\s*=\s*"([^"]+)"', f.read())
          if not match:
              raise SystemExit("Cannot read versionName")
          version = match.group(1)
          number = version.split()[0]
          apk = number + ".apk"
          readme = f"""# KillSuoji · Android 应用

          KillSuoji 是一款基于 Android 的 Root 工具应用。

          ## 当前版本
          - 版本：**V{version}**
          - 平台：Android（最低支持 Android 8.0 / API 26）
          - APK：[下载 {apk}](https://github.com/3525808867a-dot/3525808867a-dot.github.io/releases/download/v{number}/{apk})
          - SukiSU 模块：[killsuoji-overlay-1.0.0-beta.zip](https://github.com/3525808867a-dot/3525808867a-dot.github.io/releases/download/v{number}/killsuoji-overlay-1.0.0-beta.zip)

          ## 功能简介
          - Root 权限检测及工作状态切换。
          - 工作状态开启后显示固定的 killzuoji 悬浮窗。
          - 点击悬浮窗一次，由 Root 执行原启动脚本。
          - SukiSU 常驻模块在后台服务被回收后尝试重新拉起悬浮窗服务。
          - 模块文件安装在 /data/adb/modules/killsuoji_overlay，不修改 /system、/vendor 等系统分区。

          ## 模块信息
          - 模块版本：1.0.0 beta
          - 作者：酷安ddddd
          - 仅支持 SukiSU 模块管理器格式；安装后需在管理器中启用模块并授予 KillSuoji Root 权限。

          ## 注意
          Android 系统强制停止应用、关闭悬浮窗权限或限制后台启动时，模块无法保证绕过系统限制。
          """
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY
          python3 - <<'PY'
          import json, re
          from datetime import date
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle = f.read()
          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not version_match or not code_match:
              raise SystemExit("Cannot read app version metadata")
          version = version_match.group(1)
          number = version.split()[0]
          path = "latest.json"
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError):
              data = {}
          data.update({
              "name": "KillSuoji Android 应用",
              "version": "V" + version,
              "version_code": int(code_match.group(1)),
              "status": "available",
              "updated_at": date.today().isoformat(),
              "download_page": "https://3525808867a-dot.github.io/",
              "apk": f"https://github.com/3525808867a-dot/3525808867a-dot.github.io/releases/download/v{number}/{number}.apk",
              "features": [
                  "工作状态开启后显示固定的 killzuoji 悬浮窗。",
                  "点击 killzuoji 悬浮窗一次，由 Root 执行启动脚本。",
                  "SukiSU 常驻模块在后台服务被回收后尝试重新拉起悬浮窗服务。",
                  "模块仅安装在 /data/adb/modules，不修改系统分区。"
              ],
              "module_version": "1.0.0 beta",
              "module_author": "酷安ddddd",
              "module": f"https://github.com/3525808867a-dot/3525808867a-dot.github.io/releases/download/v{number}/killsuoji-overlay-1.0.0-beta.zip",
              "notice": "V" + version + " 已发布；SukiSU 模块版本 1.0.0 beta。"
          })
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write(chr(10))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.version.outputs.apk_name }}" killsuoji-overlay-1.0.0-beta.zip README.md latest.json
          git commit -m "Publish KillSuoji APK to download site" || echo "APK unchanged"
          git push
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: KillSuoji V${{ steps.version.outputs.number }}
          make_latest: true
          overwrite_files: true
          files: |
            ${{ steps.version.outputs.apk_name }}
            killsuoji-overlay-1.0.0-beta.zip
