name: Build KillSuoji APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | cut -d '"' -f2)
          VERSION_NUMBER="${VERSION_NAME%% *}"
          APK_NAME="${VERSION_NUMBER}.apk"
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Configure persistent APK signing
        env:
          KILLSUOJI_KEYSTORE_BASE64: ${{ secrets.KILLSUOJI_KEYSTORE_BASE64 }}
          KILLSUOJI_STORE_PASSWORD: ${{ secrets.KILLSUOJI_STORE_PASSWORD }}
          KILLSUOJI_KEY_ALIAS: ${{ secrets.KILLSUOJI_KEY_ALIAS }}
          KILLSUOJI_KEY_PASSWORD: ${{ secrets.KILLSUOJI_KEY_PASSWORD }}
        run: |
          if [ -z "$KILLSUOJI_KEYSTORE_BASE64" ] || [ -z "$KILLSUOJI_STORE_PASSWORD" ] || [ -z "$KILLSUOJI_KEY_ALIAS" ] || [ -z "$KILLSUOJI_KEY_PASSWORD" ]; then
            echo "::error::Persistent signing secrets are missing. Add all four KILLSUOJI_* secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KILLSUOJI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/killsuoji-release.jks"
          echo "KILLSUOJI_KEYSTORE_FILE=$RUNNER_TEMP/killsuoji-release.jks" >> "$GITHUB_ENV"
          echo "KILLSUOJI_STORE_PASSWORD=$KILLSUOJI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_ALIAS=$KILLSUOJI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_PASSWORD=$KILLSUOJI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Copy versioned APK to download site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk_name }}"
          python3 - <<'PY'
          import os, re
          version = os.environ.get("VERSION_NAME", "")
          if not version:
              with open("app/build.gradle.kts", encoding="utf-8") as f:
                  match = re.search(r'versionName\s*=\s*"([^"]+)"', f.read())
              if not match:
                  raise SystemExit("Cannot read versionName")
              version = match.group(1)
          label = "V" + version
          note = "（当前为beta测试版，如有bug请联系作者）"
          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          readme = re.sub(r'V\d+\.\d+\.\d+(?:\s+beta)?', label, readme, flags=re.I)
          readme = readme.replace("\n\n" + note, "").replace(note, "")
          if re.search(r'beta', version, re.I):
              readme = readme.rstrip() + "\n\n" + note + "\n"
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY
          python3 - <<'PY'
          import json, re
          from datetime import date
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle = f.read()
          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code_match = re.search(r'versionCode\s*=\s*(\\d+)', gradle)
          if not version_match or not code_match:
              raise SystemExit("Cannot read app version metadata")
          version = version_match.group(1)
          number = version.split()[0]
          path = "latest.json"
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError):
              data = {}
          data.update({
              "name": "KillSuoji Android 应用",
              "version": "V" + version,
              "version_code": int(code_match.group(1)),
              "status": "available",
              "updated_at": date.today().isoformat(),
              "download_page": "https://3525808867a-dot.github.io/",
              "apk": f"https://github.com/3525808867a-dot/3525808867a-dot.github.io/releases/download/v{number}/{number}.apk",
              "features": [
                  "首次启动时以 Root 创建 /data/local/tmp/launch_killapp.sh；文件已存在时不覆盖。",
                  "Root 监听全局音量下键；连续按 5 次后以 Root 执行启动脚本。",
                  "启动脚本尝试点亮屏幕并请求关闭锁屏界面，然后启动 KillSuoji。"
              ],
              "notice": "V" + version + " 安装包已构建并发布，可下载。"
          })
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write(chr(10))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.version.outputs.apk_name }}" README.md latest.json
          git commit -m "Publish KillSuoji APK to download site" || echo "APK unchanged"
          git push
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: KillSuoji ${{ steps.version.outputs.number }} beta
          make_latest: true
          files: ${{ steps.version.outputs.apk_name }}
