name: Build KillSuoji root permission probe

on:
  push:
    branches: [root-surface-prototype]
    paths:
      - "app/**"
      - "permission-probe/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/root-prototype-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Diagnose Gradle projects and tasks
        run: |
          gradle projects
          gradle :permission-probe:tasks --all
      - name: Build diagnostic APK
        run: gradle :permission-probe:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: killsuoji-root-permission-probe
          path: permission-probe/build/outputs/apk/debug/permission-probe-debug.apk
          if-no-files-found: error
          retention-days: 7
