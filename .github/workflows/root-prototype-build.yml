name: Build KillSuoji root permission probe

on:
  push:
    branches: [root-surface-prototype]
    paths:
      - "app/**"
      - "permission-probe/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/root-prototype-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Diagnose Gradle projects and tasks
        run: |
          gradle projects
          gradle :permission-probe:tasks --all
      - name: Build diagnostic and full PR-05 APKs
        run: |
          gradle :permission-probe:assembleDebug
          gradle :app:assembleDebug
      - name: Publish APK to prototype branch
        run: |
          mkdir -p downloads
          cp permission-probe/build/outputs/apk/debug/permission-probe-debug.apk downloads/killsuoji-root-permission-probe.apk
          cp app/build/outputs/apk/debug/app-debug.apk downloads/2.6.3-PR-05.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/killsuoji-root-permission-probe.apk downloads/2.6.3-PR-05.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish root permission probe APK"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: killsuoji-pr-05-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            permission-probe/build/outputs/apk/debug/permission-probe-debug.apk
          if-no-files-found: error
          retention-days: 7
