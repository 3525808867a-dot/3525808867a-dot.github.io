<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5fbf7">
<meta name="description" content="KillSuoji Android 工具下载中心">
<title>KillSuoji · 专属下载中心</title>
<style>
:root{color-scheme:light;--bg:#f5f8f6;--card:#fff;--mint:#dff8e8;--green:#20c66a;--deep:#078846;--text:#151a17;--muted:#68736d;--line:#e7eee9}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f2faf5,#f8faf8 48%,#f2f7f4);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(760px,92%);margin:auto;padding:42px 0 60px}.top{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.02em}.logo{width:46px;height:46px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:15px}.top small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;font-size:12px}
h1{font-size:clamp(36px,8vw,56px);line-height:1.1;margin:34px 0 10px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0;max-width:590px}
.hero{margin-top:30px;padding:28px;border-radius:28px;background:linear-gradient(130deg,#e4faeb,#d5f7e1);position:relative;overflow:hidden;min-height:230px}.tag{display:inline-flex;padding:4px 12px;border-radius:99px;background:#baf0cc;color:#087b3d;font-size:12px;font-weight:750}.hero h2{font-size:34px;margin:42px 0 2px}.hero p{color:#53705e;margin:0}.hero.error{background:linear-gradient(130deg,#fff0f0,#ffe1e1);border:1px solid #ffd0d0}.hero.error .tag{background:#ffdada;color:#b42318}.hero.error h2,.hero.error p{color:#b42318}.check{position:absolute;right:-20px;bottom:-50px;width:190px;height:190px;border:15px solid #36d47b;border-radius:50%;color:#36d47b;font-size:110px;line-height:155px;text-align:center;font-weight:300;opacity:.8}.hero.error .check{border-color:#e5484d;color:#e5484d}
.download-btn{display:flex;width:100%;height:48px;margin-top:12px;align-items:center;justify-content:center;border-radius:14px;background:#e9eeeb;color:#87928b;text-decoration:none;font-weight:800;pointer-events:none;cursor:not-allowed}.card{margin-top:18px;padding:24px;border-radius:24px;background:var(--card);box-shadow:0 8px 28px #1b58300a;border:1px solid #edf2ee}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.version{font:600 13px ui-monospace,monospace;color:var(--deep)}a.btn{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:14px;background:var(--mint);color:var(--deep);text-decoration:none;font-weight:800}a.btn:hover{background:#c9f3d7}.btn.secondary{background:#f2f5f3;color:#39443d;margin-left:8px}.btn.disabled{background:#e9eeeb;color:#87928b;cursor:not-allowed;pointer-events:none;box-shadow:none}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.tile{padding:17px;border-radius:18px;background:#fbfdfb;border:1px solid var(--line)}.tile b{display:block;font-size:20px}.tile span{font-size:13px;color:var(--muted)}ul{padding-left:20px;color:var(--muted)}li{margin:5px 0}.foot{text-align:center;color:#8a968f;font-size:12px;margin-top:28px}
@media(max-width:560px){main{padding-top:28px}.hero,.card{padding:20px}.hero h2{font-size:30px}.info{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<header class="top" id="dev-trigger" title="KillSuoji"><div class="logo">Kill</div><div>KillSuoji<small>ANDROID TOOL · DOWNLOAD CENTER</small></div></header>
<h1>KillSuoji 下载中心</h1><p class="sub">一款针对锁机软件的工具，通过 Root 从而拦截锁机。</p>
<section class="hero error" id="update-card"><span class="tag">KILLSUOJI · ANDROID</span><h2>检查更新</h2><p id="update-summary">V2.0.0 Beta（Miuix 版）正在修复构建，暂时不可下载</p><div class="check" id="update-icon">×</div></section>
<a class="download-btn" aria-disabled="true">下载</a>
<section class="card" id="dev-panel" hidden aria-live="polite"><div class="row"><strong>开发者模式 · 构建进度</strong><span class="version" id="build-state">正在连接…</span></div><p class="muted" id="build-detail">正在获取 GitHub Actions 最新构建状态</p><div style="height:8px;background:#edf1ee;border-radius:99px;overflow:hidden"><div id="build-bar" style="height:100%;width:4%;background:#20a464;border-radius:99px;transition:width .25s"></div></div><p class="muted" id="build-time" style="font-size:12px;margin-bottom:0">每秒自动刷新</p></section>

<section class="card"><strong>版本说明</strong><p class="muted">说明暂时无法显示</p></section>
<p class="foot">KillSuoji · 专属下载中心</p>
</main>
<script>
(()=>{
 const trigger=document.getElementById('dev-trigger'),panel=document.getElementById('dev-panel');
 let taps=0,resetTap,timer=null,opened=false;
 const endpoint='https://api.github.com/repos/3525808867a-dot/3525808867a-dot.github.io/actions/runs?per_page=1';
 const state=document.getElementById('build-state'),detail=document.getElementById('build-detail'),bar=document.getElementById('build-bar'),stamp=document.getElementById('build-time');
 function toggle(){opened=!opened;panel.hidden=!opened;if(opened){refresh();timer=setInterval(refresh,1000);}else if(timer){clearInterval(timer);timer=null;}}
 trigger.addEventListener('click',()=>{taps++;clearTimeout(resetTap);if(taps>=10){taps=0;if(opened){toggle();return;}const code=window.prompt('请输入开发者模式密码');if(code==='0312'){window.alert('开发者模式已开启');toggle();}else if(code!==null){window.alert('密码错误');}}else{resetTap=setTimeout(()=>{taps=0;},2500);}});
 async function refresh(){try{const res=await fetch(endpoint,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});if(!res.ok)throw new Error(res.status===403?'GitHub API 请求频率受限':'HTTP '+res.status);const data=await res.json(),run=data.workflow_runs&&data.workflow_runs[0];if(!run){state.textContent='暂无构建';detail.textContent='仓库暂未找到 Actions 构建记录';bar.style.width='0%';return;}const status=run.status,result=run.conclusion;let pct=4,label='等待开始';if(status==='in_progress'){pct=55;label='正在构建';}else if(status==='completed'){pct=100;label=result==='success'?'构建成功':result==='cancelled'?'已取消':'构建失败';}else if(status==='queued'){pct=8;label='排队中';}state.textContent=label;detail.textContent='工作流：'+run.name+' · '+(run.head_sha||'').slice(0,7)+' · '+(result||status);bar.style.width=pct+'%';stamp.textContent='最近更新：'+new Date(run.updated_at||run.created_at).toLocaleString()+' · 每秒刷新';}catch(e){state.textContent='暂时无法获取';detail.textContent=e.message+'；请稍后重试';stamp.textContent='刷新时间：'+new Date().toLocaleTimeString();}}
})();
</script>
</body></html>
